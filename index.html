<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPCX IPO Playbook</title>
  <link rel="stylesheet" href="src/styles/styles.css" />
</head>
<body>
  <div class="tape" id="tape" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <div>
        <div class="head-top">
          <div class="title">SPCX <span>IPO PLAYBOOK</span></div>
          <button class="langbtn" id="langBtn">🌐 <span id="langLabel">Español</span></button>
        </div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="catalysts mono" id="catalysts"></div>
    </header>

    <div class="phases" id="phases"></div>
    <div class="directive" id="directive"></div>
    <div class="trigger" id="trigger"></div>

    <div class="sec-label" id="frameworkLabel"></div>
    <div class="framework" id="framework"></div>

    <div class="sec-label" id="holdingsLabel"></div>
    <div class="holdings" id="holdings"></div>
    <div class="classification" id="classification"></div>

    <div class="sec-label" id="closingLabel"></div>
    <div class="closing" id="closing"></div>

    <footer><span class="pulse"></span><span id="footerText"></span></footer>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
